name: Gatling and Grafana
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRAFANA_ADMIN_PASSWORD: loadharbor-ci-demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Start monitoring
        run: |
          mkdir -p .run/runs
          docker compose up -d --build
      - name: Run Gatling smoke profile
        run: python run.py --profile smoke --duration 20
      - name: Verify metrics and Grafana dashboard
        run: python ci/verify_monitoring.py
      - name: Capture monitoring logs
        if: always()
        run: docker compose logs --no-color > .run/monitoring.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadharbor-results
          include-hidden-files: true
          path: |
            .run/
            target/gatling/
      - name: Stop monitoring
        if: always()
        run: docker compose down
